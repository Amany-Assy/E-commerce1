<header class="bg-gradient-to-r from-green-600 to-green-400 p-8 md:p-12 text-white">
    <div class="container mx-auto">
      <nav class="text-sm mb-6 opacity-80">
        <span class="hover:underline cursor-pointer">Home</span> / 
        <span class="font-semibold">Brands</span>
      </nav>

      <div class="flex items-center gap-4">
        <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-sm shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-4xl font-bold">{{subBrands()?.name}}</h1>
          <p class="text-lg opacity-90">Shop {{subBrands()?.name}} products</p>
        </div>
      </div>
    </div>
  </header>
<div class="min-h-screen bg-gray-50 p-6 md:p-10 font-sans">
  
  <div class="mb-10 text-gray-700">
    <div class="flex flex-wrap items-center gap-4 text-sm mb-4">
      <span class="font-medium text-gray-500 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd" />
        </svg>

      </span>
      
      <div class="bg-purple-100 text-purple-700 font-semibold px-3 py-1 rounded-full flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
        </svg>
        SONY

      </div>

      <button class="text-gray-500 hover:text-purple-700 font-medium underline">

      </button>
    </div>

    <p class="text-sm font-medium text-gray-500">Showing 9 products</p>
  </div>
