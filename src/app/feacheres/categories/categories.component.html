 <div class="bg-green-600 text-white px-10 py-12">
    <p class="text-sm mb-2 opacity-80">Home / Categories</p>

    <div class="flex items-center gap-4">
      <div class="bg-green-500 p-4 rounded-lg text-2xl"> <i class="fa-solid fa-layer-group"></i> </div>

      <div>
        <h2 class="text-3xl font-bold">All Categories</h2>
        <p class="opacity-80">Browse our wide range of product categories</p>
      </div>
    </div>
  </div>

  <!-- Categories Grid -->
  <div class="p-10 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">

   @for (categ of categories(); track categ._id) {
  <div class="bg-white rounded-xl shadow p-4 text-center hover:shadow-lg transition group">

    <img 
    [routerLink]="['/catdetails' , categ._id , categ.slug]"
      [src]="categ.image"
      class="w-full h-40 object-cover rounded-lg mx-auto mb-4 transition-transform duration-300 group-hover:scale-110"
    />

    <h3 class="font-semibold">
      {{ categ.name }}
    </h3>
      <p class="text-green-600 text-sm mt-2 opacity-0 translate-y-2 
              transition-all duration-300 group-hover:opacity-100 group-hover:translate-y-0">
      View Subcategories
    </p>

  </div>
}
    

    


  </div>
