<div class="min-h-screen bg-gray-50">
  
  <header class="bg-gradient-to-r from-purple-600 to-purple-400 p-8 md:p-12 text-white">
    <div class="container mx-auto">
      <nav class="text-sm mb-6 opacity-80">
        <span class="hover:underline cursor-pointer">Home</span> / 
        <span class="font-semibold">Brands</span>
      </nav>

      <div class="flex items-center gap-4">
        <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-sm shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-4xl font-bold">Top Brands</h1>
          <p class="text-lg opacity-90">Shop from your favorite brands</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto py-12 px-4">
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6">
      
        @for (brand of brands(); track brand._id) {
           <div [routerLink]="['/spesificbrand' , brand._id , brand.slug]" class="group bg-white border border-gray-100 rounded-xl p-4 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col items-center cursor-pointer">
  
  <div class="bg-gray-50 w-full aspect-square rounded-lg flex items-center justify-center mb-4 p-4">
    <img [src]="brand.image" [alt]="brand.name" class="max-w-full h-auto mix-blend-multiply">
  </div>

  <span class="font-medium text-gray-800">{{brand.name}}</span>

  <span class="text-purple-600 text-sm font-semibold opacity-0 h-0 group-hover:opacity-100 group-hover:h-6 transition-all duration-300 overflow-hidden mt-1">
    View Products
  </span>
  
</div>
        }
      

     
    </div>
  </main>
</div>
